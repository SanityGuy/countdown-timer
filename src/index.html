<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Countdown Timer">
    <meta name="theme-color" content="#111111">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon_io/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header-container">
        <h1 id="title">Countdown Timer</h1>
        <div class="top-controls">
            <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
            <select id="langSelect" class="lang-dropdown" aria-label="Language selector">
                <option value="en">EN</option>
                <option value="ru">RU</option>
                <option value="id">ID</option>
            </select>
        </div>
    </header>
    <main class="text-container">
        <input type="text" id="eventTitleInput" class="event-title-input" placeholder="Event Title..." value="Countdown Timer">
        <p id="current">Current Date</p>
        <p id="until">until (Date)</p>
        <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
        <h1 id="countdown">Loading...</h1>
        <div class="controls-row">
            <button id="pauseBtn" class="control-btn"><i class="fa-solid fa-pause"></i> <span id="pauseLabel">Pause</span></button>
            <button id="resetBtn" class="control-btn"><i class="fa-solid fa-rotate-right"></i> <span id="resetLabel">Reset</span></button>
        </div>
        <div class="presets-container">
            <button class="preset-chip" data-add-hours="1">+1H</button>
            <button class="preset-chip" data-add-hours="24">+1D</button>
            <button class="preset-chip" data-add-days="7">+1W</button>
            <button class="preset-chip" data-preset="ny">New Year</button>
        </div>
        <label for="targetDate" id="dateLabel">Enter target date and time:</label>
        <input type="datetime-local" id="targetDate" name="targetDate" step="60">
    </main>
    <footer class="footer">
        <p id="footertext">made by Souyan (SanityGuy)</p>
        <p id="visitmygithub">
            <a href="https://github.com/SanityGuy" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> <span id="githubLabel">Github</span></a>
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
</body>
</html>
