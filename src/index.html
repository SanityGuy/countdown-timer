<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Countdown Timer">
    <meta name="keywords" content="Countdown, Countdown Timer, Countdown Clock, Countdown Timer, Countdown Countdown">
    <meta name="author" content="SanityGuy">
    <meta name="theme-color" content="#ffffff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/favicon_io/favicon.ico" type="image/x-icon">
    <title>Countdown</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
</head>
<body>

    <header class="header-container">
        <h1 id="title">Countdown Timer</h1>

        <div class="lang-switcher" aria-label="Language selector">
            <button class="lang-btn active" data-lang="en"  aria-pressed="true">EN</button>
            <button class="lang-btn"        data-lang="ru"  aria-pressed="false">RU</button>
            <button class="lang-btn"        data-lang="id"  aria-pressed="false">ID</button>
        </div>
    </header>

    <main class="text-container">
        <p id="current">Current Date</p>
        <p id="until">until (Date)</p>
        <hr class="divider">
        <h1 id="countdown">Loading...</h1>

        <label for="targetDate" id="dateLabel">Enter target date and time:</label>
        <input type="datetime-local" id="targetDate" name="targetDate" step="60">
    </main>

    <footer class="footer">
        <p id="footertext">made by Souyan (SanityGuy)</p>
        <p id="visitmygithub">
            <a href="https://github.com/SanityGuy" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-github"></i>
                <span id="githubLabel">Github</span>
            </a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>

</body>

</html>
